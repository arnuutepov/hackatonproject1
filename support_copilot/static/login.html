<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Oguzki · Вход оператора</title><link rel="stylesheet" href="/auth/login.css"><script src="/auth/login.js" defer></script></head><body><main><div class="brand">OGUZKI <span>SUPPORT COPILOT</span></div><h1>Вход оператора</h1><p>Рабочее пространство сотрудников поддержки.</p><form id="login-form"><label for="username">Имя пользователя</label><input id="username" autocomplete="username" required minlength="3" maxlength="64"><label for="password">Пароль</label><input id="password" type="password" autocomplete="current-password" required minlength="15" maxlength="256"><p id="login-error" role="alert" hidden></p><button id="login-submit">Войти</button></form><p class="hint">Первого сотрудника создаёт владелец сервиса локальной командой manage_operators. Общего пароля по умолчанию нет.</p></main></body></html>
