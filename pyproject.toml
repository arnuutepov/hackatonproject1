[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "oguzki-support-copilot"
version = "0.7.0"
description = "Grand Mobile Support Copilot — Wave 7 submission"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2,<3", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
copilot-predict = "support_copilot.cli:main"

[tool.setuptools.packages.find]
include = ["support_copilot*"]

[tool.setuptools.package-data]
support_copilot = ["static/*.html", "static/*.css", "static/*.js", "static/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
