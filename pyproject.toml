[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "oguzki-support-copilot"
version = "0.11.0"
description = "Grand Mobile Support Copilot — authenticated operator workspace and signed game ingress"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2,<3", "uvicorn>=0.30,<1", "PyJWT[crypto]>=2.15.1,<3", "cryptography>=42,<51", "defusedxml>=0.7.1,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "PyYAML>=6,<7"]
# Offline category trainer only (support_copilot.category_training); inference needs none of these.
train = ["scikit-learn>=1.5,<2", "numpy>=1.26,<3", "scipy>=1.11,<2"]

[project.scripts]
copilot-predict = "support_copilot.cli:main"

[tool.setuptools.packages.find]
include = ["support_copilot*"]

[tool.setuptools.package-data]
support_copilot = ["static/*.html", "static/*.css", "static/*.js", "static/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["private_data: requires local organizer dictionaries; excluded from public CI"]
